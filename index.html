<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页</title>
</head>
<body>
    <!-- 页面头部 -->
    <header>
        <h1>欢迎来到我的网站</h1>
        <nav>
            <ul>
                <li><a href="#home">首页</a></li>
                <li><a href="#about">关于</a></li>
                <li><a href="#contact">联系</a></li>
            </ul>
        </nav>
    </header>

    <!-- 主要内容区域 -->
    <main>
        <section>
            <h2>简介</h2>
            <p>这是一个简单的HTML示例页面，用于演示基本HTML结构。</p>
            <p>你可以在这里练习HTML编写！</p>
        </section>

        <section>
            <h3>学习列表</h3>
            <ul>
                <li>HTML基础</li>
                <li>CSS样式</li>
                <li>JavaScript交互</li>
            </ul>
        </section>

        <article>
            <h4>小贴士</h4>
            <p>使用<strong>语义化标签</strong>可以让网页更易理解！</p>
        </article>
    </main>

    <!-- 页脚 -->
    <footer>
        <p>© 2023 我的网站</p>
        <a href="https://www.example.com">示例链接</a>
        <br>
        <img src="image.jpg" alt="示例图片" width="200">
    </footer>
</body>
</html>
